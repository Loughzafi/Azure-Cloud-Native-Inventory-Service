services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_app -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: inventory-api:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=inventory;Username=inventory_app;Password=${POSTGRES_PASSWORD:-local-dev-only}
      Authentication__Authority: ${AUTHORITY:-https://login.microsoftonline.com/organizations/v2.0}
      Authentication__Audience: ${API_AUDIENCE:-api://local-smoke-test}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
